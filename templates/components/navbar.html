{% load static %}
<nav class="navbar">
    <div class="navbar-inner">
        <a href="{% url 'main:home' %}" class="navbar-brand">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="brand-logo" style="height: 52px; width: 52px; border-radius: 50%; object-fit: cover; transform: scale(1.1); margin-right: 8px;">
            <span class="brand-text"><strong>PlaceForge AI</strong> Portal</span>
        </a>

        <div class="navbar-tagline"></div>

        <div class="navbar-right">
            <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle Theme" onclick="toggleTheme()" style="margin-right: 0.5rem;">
                <span class="icon-light">🌙</span>
                <span class="icon-dark" style="display:none;">☀️</span>
            </button>
            <form action="{% url 'dashboard:search' %}" method="get" class="search-form">
                <input type="text" name="q" placeholder="Search topics, questions, or concepts..." class="search-input"
                    value="{{ request.GET.q }}">
                <button type="submit" class="search-btn">🔍</button>
            </form>



            {% if user.is_authenticated %}
            <div class="user-menu" onclick="toggleUserMenu()">
                {% if user.profile and user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" alt="Profile" class="user-avatar"
                    style="object-fit: cover; border-radius: 50%; padding: 0;">
                {% else %}
                <div class="user-avatar">{{ user.first_name|first|default:user.username|first|upper }}</div>
                {% endif %}
                <div class="dropdown-menu" id="userDropdown">
                    <a href="{% url 'accounts:profile' %}"><span>👤</span> My Profile</a>
                    <a href="{% url 'dashboard:home' %}"><span>📊</span> Dashboard</a>
                    <a href="#"><span>⚙️</span> Settings</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit"><span>🚪</span> Logout</button>
                    </form>
                </div>
            </div>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="btn btn-outline">Login</a>
            <a href="{% url 'accounts:signup' %}" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </div>

        <button class="hamburger" onclick="toggleMobileSidebar()">☰</button>
    </div>
</nav>
